# OmniServe Docker Compose with Prometheus/Grafana request metrics
#
# Quick start:
#   1. Copy .env.example to .env and set your API keys
#   2. docker-compose up
#
# Services:
#   - OmniServe: http://localhost:8000 (API + /prometheus)
#   - Prometheus: http://localhost:9090
#   - Grafana: http://localhost:3000 (admin/admin)

services:
  # =========================================================================
  # OmniServe - The AI Agent API Server
  # =========================================================================
  omnicoreagent-serve:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: omnicoreagent-serve
    ports:
      - "${OMNICOREAGENT_SERVE_PORT:-8000}:8000"
    environment:
      # =======================================================================
      # LLM API Key (Required)
      # =======================================================================
      - LLM_API_KEY=${LLM_API_KEY:-}
      
      # =======================================================================
      # Server Configuration
      # =======================================================================
      - OMNICOREAGENT_SERVE_HOST=${OMNICOREAGENT_SERVE_HOST:-0.0.0.0}
      - OMNICOREAGENT_SERVE_PORT=${OMNICOREAGENT_SERVE_PORT:-8000}
      - OMNICOREAGENT_SERVE_WORKERS=${OMNICOREAGENT_SERVE_WORKERS:-1}
      - OMNICOREAGENT_SERVE_API_PREFIX=${OMNICOREAGENT_SERVE_API_PREFIX:-}
      
      # =======================================================================
      # Documentation
      # =======================================================================
      - OMNICOREAGENT_SERVE_ENABLE_DOCS=${OMNICOREAGENT_SERVE_ENABLE_DOCS:-true}
      - OMNICOREAGENT_SERVE_ENABLE_REDOC=${OMNICOREAGENT_SERVE_ENABLE_REDOC:-true}
      
      # =======================================================================
      # CORS Configuration
      # =======================================================================
      - OMNICOREAGENT_SERVE_CORS_ENABLED=${OMNICOREAGENT_SERVE_CORS_ENABLED:-true}
      - OMNICOREAGENT_SERVE_CORS_ORIGINS=${OMNICOREAGENT_SERVE_CORS_ORIGINS:-*}
      - OMNICOREAGENT_SERVE_CORS_METHODS=${OMNICOREAGENT_SERVE_CORS_METHODS:-*}
      - OMNICOREAGENT_SERVE_CORS_HEADERS=${OMNICOREAGENT_SERVE_CORS_HEADERS:-*}
      - OMNICOREAGENT_SERVE_CORS_CREDENTIALS=${OMNICOREAGENT_SERVE_CORS_CREDENTIALS:-true}
      
      # =======================================================================
      # Authentication
      # =======================================================================
      - OMNICOREAGENT_SERVE_AUTH_ENABLED=${OMNICOREAGENT_SERVE_AUTH_ENABLED:-false}
      - OMNICOREAGENT_SERVE_AUTH_TOKEN=${OMNICOREAGENT_SERVE_AUTH_TOKEN:-}
      
      # =======================================================================
      # Logging
      # =======================================================================
      - OMNICOREAGENT_SERVE_REQUEST_LOGGING=${OMNICOREAGENT_SERVE_REQUEST_LOGGING:-true}
      - OMNICOREAGENT_SERVE_LOG_LEVEL=${OMNICOREAGENT_SERVE_LOG_LEVEL:-INFO}
      
      # =======================================================================
      # Rate Limiting
      # =======================================================================
      - OMNICOREAGENT_SERVE_RATE_LIMIT_ENABLED=${OMNICOREAGENT_SERVE_RATE_LIMIT_ENABLED:-false}
      - OMNICOREAGENT_SERVE_RATE_LIMIT_REQUESTS=${OMNICOREAGENT_SERVE_RATE_LIMIT_REQUESTS:-100}
      - OMNICOREAGENT_SERVE_RATE_LIMIT_WINDOW=${OMNICOREAGENT_SERVE_RATE_LIMIT_WINDOW:-60}
      
      # =======================================================================
      # Timeouts
      # =======================================================================
      - OMNICOREAGENT_SERVE_REQUEST_TIMEOUT=${OMNICOREAGENT_SERVE_REQUEST_TIMEOUT:-300}

      # =======================================================================
      # Workspace Files
      # =======================================================================
      - OMNICOREAGENT_WORKSPACE_BACKEND=${OMNICOREAGENT_WORKSPACE_BACKEND:-local}
      - OMNICOREAGENT_WORKSPACE_DIR=${OMNICOREAGENT_WORKSPACE_DIR:-/app/workspace}
      - OMNICOREAGENT_WORKSPACE_PREFIX=${OMNICOREAGENT_WORKSPACE_PREFIX:-workspace}

      # =======================================================================
      # Background Agents
      # =======================================================================
      - OMNICOREAGENT_BACKGROUND_ENABLED=${OMNICOREAGENT_BACKGROUND_ENABLED:-true}
      - OMNICOREAGENT_BACKGROUND_AGENT_ID=${OMNICOREAGENT_BACKGROUND_AGENT_ID:-default}
      - OMNICOREAGENT_BACKGROUND_TASK_STORE=${OMNICOREAGENT_BACKGROUND_TASK_STORE:-in_memory}
      - OMNICOREAGENT_BACKGROUND_TASK_STORE_URL=${OMNICOREAGENT_BACKGROUND_TASK_STORE_URL:-}
      - OMNICOREAGENT_BACKGROUND_TASK_STORE_URI=${OMNICOREAGENT_BACKGROUND_TASK_STORE_URI:-}
      - OMNICOREAGENT_BACKGROUND_TASK_STORE_DATABASE=${OMNICOREAGENT_BACKGROUND_TASK_STORE_DATABASE:-omnicoreagent}
      - OMNICOREAGENT_BACKGROUND_TASK_STORE_PREFIX=${OMNICOREAGENT_BACKGROUND_TASK_STORE_PREFIX:-}
      - OMNICOREAGENT_BACKGROUND_TASK_STORE_COLLECTION_PREFIX=${OMNICOREAGENT_BACKGROUND_TASK_STORE_COLLECTION_PREFIX:-}
      - OMNICOREAGENT_BACKGROUND_TASK_STORE_CONNECT_TIMEOUT=${OMNICOREAGENT_BACKGROUND_TASK_STORE_CONNECT_TIMEOUT:-}
      - OMNICOREAGENT_BACKGROUND_START_WORKER=${OMNICOREAGENT_BACKGROUND_START_WORKER:-true}

      # =======================================================================
      # Cloud Storage (Optional)
      # =======================================================================
      # AWS S3
      # - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      # - AWS_REGION=${AWS_REGION:-us-east-1}
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      # - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      
      # Cloudflare R2
      # - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      # - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      # - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      # - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - omnicoreagent-serve-net
    
    # Optional: Mount custom agent file
    # volumes:
    #   - ./my_agent.py:/app/agent.py:ro
    # command: ["omniserve", "run", "--agent", "/app/agent.py"]


  # =========================================================================
  # Prometheus - Metrics Collection
  # Scrapes /prometheus endpoint from OmniServe
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: omnicoreagent-serve-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - omnicoreagent-serve-net
    depends_on:
      - omnicoreagent-serve

  # =========================================================================
  # Grafana - Metrics Visualization
  # Pre-configured to use Prometheus as data source
  # =========================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: omnicoreagent-serve-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - omnicoreagent-serve-net
    depends_on:
      - prometheus

  # =========================================================================
  # Redis (Optional) - For future durable integrations, not current rate limiting
  # =========================================================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: omnicoreagent-serve-redis
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   networks:
  #     - omnicoreagent-serve-net

networks:
  omnicoreagent-serve-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
