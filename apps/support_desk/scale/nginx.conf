# Two OmniServe replicas behind one address, as a load balancer would put them.
# least_conn sends a new request to the replica with fewer open connections,
# which suits runs that last seconds. Any replica can take any request: a
# run's state is in the shared store, not in the replica.
upstream desk_replicas {
    least_conn;
    server desk:8000;
    server desk2:8000;
}
server {
    listen 80;
    location / {
        proxy_pass http://desk_replicas;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Do not hold back the SSE stream of /run.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
