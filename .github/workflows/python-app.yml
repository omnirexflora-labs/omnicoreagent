# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Check if lock file is in sync
      run: |
        if ! uv lock --check; then
          echo "::error::uv.lock is out of sync with pyproject.toml. Please run 'uv lock' locally and commit the updated lock file."
          exit 1
        fi

    - name: Set up virtual environment
      run: |
        uv venv .venv
        echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

    - name: Cache virtual environment
      uses: actions/cache@v4
      id: venv-cache
      with:
        path: .venv
        key: venv-py312-${{ hashFiles('**/uv.lock') }}

    - name: Ensure cache is healthy
      if: steps.venv-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        timeout 10s .venv/bin/python --version || rm -rf .venv

    - name: Install dependencies
      run: |
        uv sync --all-extras --all-groups --locked

    - name: Lint with ruff
      run: |
        ruff check

    - name: Run unit tests with pytest
      run: |
        uv run --no-sync pytest -v tests -m "not requires_api_key and not requires_network and not OpenAIIntegration"
      env:
        OMNICOREAGENT_TEST_REDIS_URL: redis://localhost:6379/0
        OMNICOREAGENT_TEST_MONGODB_URI: mongodb://localhost:27017
        OMNICOREAGENT_TEST_MONGODB_DATABASE: omnicoreagent_test

    - name: Run live background manager backend tests
      run: |
        uv run --no-sync pytest -v tests/test_background_durable_manager_integration.py -rs
      env:
        OMNICOREAGENT_TEST_REDIS_URL: redis://localhost:6379/0
        OMNICOREAGENT_TEST_MONGODB_URI: mongodb://localhost:27017
        OMNICOREAGENT_TEST_MONGODB_DATABASE: omnicoreagent_test
