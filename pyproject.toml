[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[project]
name = "omnicoreagent"
dynamic = ["version"]
description = "OmniCoreAgent is an open Python agent harness for building autonomous AI agents that use tools, manage memory and context, coordinate workflows, and handle production business logic."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Abiola Adeshina", email = "abiolaadedayo1993@gmail.com" }]
requires-python = ">=3.10"

keywords = ["git", "mcp", "llm", "automation", "agent", "ai", "framework", "agent-harness"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "colorlog>=6.9.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.4",
    "httpx>=0.26.0",
    "httpx-sse>=0.4.0",
    "pydantic[email]>=2.6.0",
    "anyio>=4.2.0",
    "mcp[cli]>=1.27.0",
    "litellm>=1.75.2",
    "click>=8.1.7",
    "docstring_parser>=0.16",
    "packaging>=23.0",
]

[project.optional-dependencies]
redis = ["redis>=5.2.1"]
postgres = ["sqlalchemy>=2.0.0", "psycopg2-binary>=2.9.10"]
mongodb = ["motor>=3.7.1", "pymongo>=4.15.1"]
s3 = ["boto3>=1.42.37"]
serve = ["fastapi>=0.115.12", "uvicorn>=0.34.1", "python-multipart>=0.0.20"]
background = ["apscheduler>=3.11.0", "tzlocal>=5.2"]
tokenizer = ["tiktoken>=0.8.0"]
all = [
    "redis>=5.2.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.10",
    "motor>=3.7.1",
    "pymongo>=4.15.1",
    "boto3>=1.42.37",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.1",
    "python-multipart>=0.0.20",
    "apscheduler>=3.11.0",
    "tzlocal>=5.2",
    "tiktoken>=0.8.0",
]

[project.scripts]
omniserve = "omnicoreagent.serve.cli:main"

[project.urls]
Repository = "https://github.com/omnirexflora-labs/omnicoreagent"
Issues = "https://github.com/omnirexflora-labs/omnicoreagent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omnicoreagent"]

[tool.hatch.build]
packages = ["src/omnicoreagent"]
include = [

    "LICENSE",
    "README.mdx"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-m",
    "not broken_upstream",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: marks tests that use asyncio",
    "OpenAIIntegration: marks tests that require an OpenAI API key",
    "requires_api_key: marks tests that require external API keys or credentials",
    "requires_network: marks tests that require network access to external services",
    "broken_upstream: marks tests broken by upstream source changes (stale mocks/assertions)",
]

[tool.uv.sources]
omnicoreagent = { workspace = true }

[dependency-groups]
dev = [
    "apscheduler>=3.11.0",
    "boto3>=1.42.37",
    "fastapi>=0.115.12",
    "pre-commit>=4.2.0",
    "motor>=3.7.1",
    "psycopg2-binary>=2.9.10",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "python-multipart>=0.0.20",
    "pymongo>=4.15.1",
    "redis>=5.2.1",
    "ruff>=0.11.7",
    "sqlalchemy>=2.0.0",
    "tiktoken>=0.8.0",
    "tzlocal>=5.2",
    "uvicorn>=0.34.1",
    "hatch>=1.14.1",
    "twine>=6.1.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-material>=9.6.14",
    "mkdocs-minify-plugin>=0.8.0",
    "pymdown-extensions>=10.16",
]
