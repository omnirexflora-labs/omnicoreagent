[build-system]
requires = ["hatchling>=1.32.0", "uv-dynamic-versioning>=0.14.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[project]
name = "omnicoreagent"
dynamic = ["version"]
description = "Open Python agent harness for production AI apps: tools, MCP, memory, workspace, telemetry, subagents, background tasks, and OmniServe APIs."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Abiola Adeshina", email = "[REDACTED_EMAIL]" }]
requires-python = ">=3.12,<3.15"

keywords = [
    "agent",
    "agent-harness",
    "ai",
    "ai-agents",
    "automation",
    "background-tasks",
    "llm",
    "mcp",
    "mcp-client",
    "python",
    "runtime",
    "subagents",
    "telemetry",
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "colorlog>=6.12.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "pydantic[email]>=2.13.5",
    "mcp[cli]>=2.2.0,<3",
    "jsonschema>=4.26.0",
    "litellm>=1.101.0",
    "click>=8.5.0",
    "docstring_parser>=0.18.0",
    "packaging>=26.3",
]

[project.optional-dependencies]
redis = ["redis>=8.1.0"]
docker = ["docker>=7.2.0"]
# Code mode (run_code): an alpha interpreter, so the version is pinned exactly.
codemode = ["pydantic-monty==0.0.23"]
modal = ["modal>=1.5.5"]
e2b = ["e2b>=2.51.0"]
daytona = ["daytona>=0.214.0"]
vercel = ["vercel-sandbox>=0.6.0"]
postgres = ["sqlalchemy>=2.0.54", "psycopg2-binary>=2.9.13"]
mongodb = ["motor>=3.7.1", "pymongo>=4.18.1"]
s3 = ["boto3>=1.43.98"]
serve = ["fastapi>=0.141.1", "uvicorn>=0.53.0", "python-multipart>=0.0.32"]
tokenizer = ["tiktoken>=0.14.0"]
otel = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]
langsmith = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]
opik = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]
all = [
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
    "psycopg2-binary>=2.9.13",
    "motor>=3.7.1",
    "pymongo>=4.18.1",
    "boto3>=1.43.98",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "python-multipart>=0.0.32",
    "tiktoken>=0.14.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "markdown>=3.10.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]
examples = [
    "markdown>=3.10.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[project.scripts]
omniserve = "omnicoreagent.serve.cli:main"

[project.urls]
Repository = "https://github.com/omnirexflora-labs/omnicoreagent"
Issues = "https://github.com/omnirexflora-labs/omnicoreagent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omnicoreagent", "cookbook"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/omnicoreagent/**/*.py",
    "/cookbook/**/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: marks tests that use asyncio",
    "OpenAIIntegration: marks tests that require an OpenAI API key",
    "requires_api_key: marks tests that require external API keys or credentials",
    "requires_network: marks tests that require network access to external services",
]

[tool.uv.sources]
omnicoreagent = { workspace = true }

[dependency-groups]
dev = [
    "boto3>=1.43.98",
    "fastapi>=0.141.1",
    "pre-commit>=4.6.2",
    "motor>=3.7.1",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "pymongo>=4.18.1",
    "redis>=8.1.0",
    "ruff>=0.16.8",
    "sqlalchemy>=2.0.54",
    "tiktoken>=0.14.0",
    "uvicorn>=0.53.0",
    "hatch>=1.18.1",
    "twine>=7.0.0",
]

# Keep the existing lint policy explicit across Ruff default-rule changes.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
