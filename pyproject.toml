[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[project]
name = "omnicoreagent"
dynamic = ["version"]
description = "Open Python agent harness and runtime for production AI agents: parallel tool execution, structured observations, loop detection, memory, workspace files, MCP tools, subagents, background tasks, and OmniServe APIs."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Abiola Adeshina", email = "abiolaadedayo1993@gmail.com" }]
requires-python = ">=3.10"

keywords = ["git", "mcp", "llm", "automation", "agent", "ai", "runtime", "agent-harness"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "colorlog>=6.10.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "pydantic[email]>=2.12.5",
    "mcp[cli]>=1.27.0",
    "litellm>=1.83.14",
    "click>=8.1.8",
    "docstring_parser>=0.18.0",
    "packaging>=26.2",
]

[project.optional-dependencies]
redis = ["redis>=7.4.0"]
postgres = ["sqlalchemy>=2.0.49", "psycopg2-binary>=2.9.12"]
mongodb = ["motor>=3.7.1", "pymongo>=4.17.0"]
s3 = ["boto3>=1.43.4"]
serve = ["fastapi>=0.136.1", "uvicorn>=0.46.0", "python-multipart>=0.0.27"]
tokenizer = ["tiktoken>=0.12.0"]
otel = [
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
]
langsmith = [
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
]
opik = [
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
]
all = [
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.12",
    "motor>=3.7.1",
    "pymongo>=4.17.0",
    "boto3>=1.43.4",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "python-multipart>=0.0.27",
    "tiktoken>=0.12.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
    "markdown>=3.10.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pillow>=12.2.0",
]
examples = [
    "markdown>=3.10.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pillow>=12.2.0",
]

[project.scripts]
omniserve = "omnicoreagent.serve.cli:main"

[project.urls]
Repository = "https://github.com/omnirexflora-labs/omnicoreagent"
Issues = "https://github.com/omnirexflora-labs/omnicoreagent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omnicoreagent"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/omnicoreagent/**/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: marks tests that use asyncio",
    "OpenAIIntegration: marks tests that require an OpenAI API key",
    "requires_api_key: marks tests that require external API keys or credentials",
    "requires_network: marks tests that require network access to external services",
]

[tool.uv.sources]
omnicoreagent = { workspace = true }

[dependency-groups]
dev = [
    "boto3>=1.43.4",
    "fastapi>=0.136.1",
    "pre-commit>=4.6.0",
    "motor>=3.7.1",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-multipart>=0.0.27",
    "pymongo>=4.17.0",
    "redis>=7.4.0",
    "ruff>=0.15.12",
    "sqlalchemy>=2.0.49",
    "tiktoken>=0.12.0",
    "uvicorn>=0.46.0",
    "hatch>=1.16.5",
    "twine>=6.2.0",
]
