[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[project]
name = "omnicoreagent"
dynamic = ["version"]
description = "OmniCoreAgent is an open Python agent harness for building autonomous AI agents that use tools, manage memory and context, coordinate workflows, and handle production business logic."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Abiola Adeshina", email = "abiolaadedayo1993@gmail.com" }]
requires-python = ">=3.10"

keywords = ["git", "mcp", "llm", "automation", "agent", "ai", "framework", "agent-harness"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "colorlog>=6.10.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "pydantic[email]>=2.12.5",
    "anyio>=4.13.0",
    "mcp[cli]>=1.27.0",
    "litellm>=1.83.14",
    "click>=8.1.8",
    "docstring_parser>=0.18.0",
    "packaging>=26.2",
]

[project.optional-dependencies]
redis = ["redis>=7.4.0"]
postgres = ["sqlalchemy>=2.0.49", "psycopg2-binary>=2.9.12"]
mongodb = ["motor>=3.7.1", "pymongo>=4.17.0"]
s3 = ["boto3>=1.43.4"]
serve = ["fastapi>=0.136.1", "uvicorn>=0.46.0", "python-multipart>=0.0.27"]
background = ["apscheduler>=3.11.2", "tzlocal>=5.3.1"]
tokenizer = ["tiktoken>=0.12.0"]
all = [
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.12",
    "motor>=3.7.1",
    "pymongo>=4.17.0",
    "boto3>=1.43.4",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "python-multipart>=0.0.27",
    "apscheduler>=3.11.2",
    "tzlocal>=5.3.1",
    "tiktoken>=0.12.0",
]

[project.scripts]
omniserve = "omnicoreagent.serve.cli:main"

[project.urls]
Repository = "https://github.com/omnirexflora-labs/omnicoreagent"
Issues = "https://github.com/omnirexflora-labs/omnicoreagent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omnicoreagent"]

[tool.hatch.build]
packages = ["src/omnicoreagent"]
include = [

    "LICENSE",
    "README.mdx"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-m",
    "not broken_upstream",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: marks tests that use asyncio",
    "OpenAIIntegration: marks tests that require an OpenAI API key",
    "requires_api_key: marks tests that require external API keys or credentials",
    "requires_network: marks tests that require network access to external services",
    "broken_upstream: marks tests broken by upstream source changes (stale mocks/assertions)",
]

[tool.uv.sources]
omnicoreagent = { workspace = true }

[dependency-groups]
dev = [
    "apscheduler>=3.11.2",
    "boto3>=1.43.4",
    "fastapi>=0.136.1",
    "pre-commit>=4.6.0",
    "motor>=3.7.1",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-multipart>=0.0.27",
    "pymongo>=4.17.0",
    "redis>=7.4.0",
    "ruff>=0.15.12",
    "sqlalchemy>=2.0.49",
    "tiktoken>=0.12.0",
    "tzlocal>=5.3.1",
    "uvicorn>=0.46.0",
    "hatch>=1.16.5",
    "twine>=6.2.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-minify-plugin>=0.8.0",
    "pymdown-extensions>=10.21.2",
]
